name: Build and publish LightStudio.Photos

on:
  push:
    tags:
      - "photos-v*"
  workflow_dispatch:
    inputs:
      package_version:
        description: NuGet package version
        required: true
        default: "0.22.2"
        type: string
      publish:
        description: Publish to NuGet.org (requires NUGET_API_KEY)
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: photos-${{ github.ref }}
  cancel-in-progress: false

env:
  PACKAGE_OUTPUT: artifacts/packages
  NUGET_SOURCE: https://api.nuget.org/v3/index.json

jobs:
  build-linux:
    name: Build photos-${{ matrix.target }} (glibc 2.17)
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-22.04
            image: quay.io/pypa/manylinux2014_x86_64@sha256:493d2032114d757aaa761a9385ad8497f391503bf71acef9abeeb66682ca5d90
          - target: linux-arm64
            runner: ubuntu-22.04-arm
            image: quay.io/pypa/manylinux2014_aarch64@sha256:f4cd164263e4ec2b7da7ee40b319bb5e30f0d7a2abd7ad4730e716a512dfb529
    env:
      MANYLINUX_IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch photo dependencies
        run: git submodule update --init libraw lcms2 libjpeg-turbo zlib
      - name: Build on the compatibility baseline
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp
          -v "$PWD:/work" -w /work "$MANYLINUX_IMAGE"
          ./scripts/build-photos.sh "${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: photos-${{ matrix.target }}
          path: artifacts/photos-${{ matrix.target }}
          if-no-files-found: error

  build-windows:
    name: Cross-build photos-win-x64 (MinGW)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch photo dependencies
        run: git submodule update --init libraw lcms2 libjpeg-turbo zlib
      - name: Set up Autotools and MinGW
        run: |
          sudo -n apt-get update
          sudo -n apt-get install --no-install-recommends -y autoconf automake libtool pkg-config cmake gcc-mingw-w64-x86-64-win32 g++-mingw-w64-x86-64-win32
      - name: Build Windows DLLs
        run: ./scripts/build-photos.sh win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: photos-win-x64
          path: artifacts/photos-win-x64
          if-no-files-found: error

  build-windows-arm64:
    name: Cross-build photos-win-arm64 (LLVM-MinGW)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch photo dependencies
        run: git submodule update --init libraw lcms2 libjpeg-turbo zlib
      - name: Set up Autotools and CMake
        run: |
          sudo -n apt-get update
          sudo -n apt-get install --no-install-recommends -y autoconf automake libtool pkg-config cmake
      - name: Set up pinned LLVM-MinGW
        run: ./scripts/setup-photos-llvm-mingw.sh
      - name: Build Windows ARM64 DLLs
        run: ./scripts/build-photos.sh win-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: photos-win-arm64
          path: artifacts/photos-win-arm64
          if-no-files-found: error

  build-windows-static:
    name: Build photos-${{ matrix.rid }} static (MSVC)
    runs-on: windows-2022
    env:
      PHOTOS_BUILD_JOBS: "4"
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            vc_arch: x64
          - rid: win-arm64
            vc_arch: amd64_arm64
    steps:
      - uses: actions/checkout@v4
      - name: Fetch photo dependencies
        run: git submodule update --init libraw lcms2 libjpeg-turbo zlib
      - name: Set up MSVC and Windows SDK
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.vc_arch }}
      - name: Set up MSYS2 and LLVM
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          path-type: inherit
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-lld
            mingw-w64-ucrt-x86_64-llvm
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - name: Build Windows static libraries
        shell: msys2 {0}
        run: |
          export PATH="/usr/bin:/ucrt64/bin:$PATH"
          bash scripts/build-photos-windows-static.sh "${{ matrix.rid }}"
      - uses: actions/upload-artifact@v4
        with:
          name: photos-${{ matrix.rid }}-static
          path: artifacts/photos-${{ matrix.rid }}-static
          if-no-files-found: error

  build-android:
    name: Build photos-android
    runs-on: ubuntu-22.04
    env:
      ANDROID_API_LEVEL: "21"
      ANDROID_NDK_VERSION: 28.2.13676358
    steps:
      - uses: actions/checkout@v4
      - name: Fetch photo dependencies
        run: git submodule update --init libraw lcms2 libjpeg-turbo zlib
      - name: Set up Autotools
        run: |
          sudo -n apt-get update
          sudo -n apt-get install --no-install-recommends -y autoconf automake libtool pkg-config cmake
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'ndk;28.2.13676358'
      - name: Build Android libraries
        run: |
          android_sdk_root="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export ANDROID_NDK_HOME="$android_sdk_root/ndk/$ANDROID_NDK_VERSION"
          ./scripts/build-photos-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: photos-android
          path: artifacts/photos-android
          if-no-files-found: error

  build-browser-wasm:
    name: Build photos-${{ matrix.target }}-${{ matrix.emsdk.flavor }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target: [browser-wasm, browser-wasm-mt]
        emsdk:
          - version: '3.1.69'
            flavor: em3
          - version: '6.0.2'
            flavor: em6
    steps:
      - uses: actions/checkout@v4
      - name: Fetch photo dependencies
        run: git submodule update --init libraw lcms2 libjpeg-turbo zlib
      - name: Set up Autotools
        run: |
          sudo -n apt-get update
          sudo -n apt-get install --no-install-recommends -y autoconf automake libtool pkg-config cmake
      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ matrix.emsdk.version }}
          actions-cache-folder: artifacts/emsdk-cache
      - name: Build wasm libraries
        run: ./scripts/build-photos.sh "${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: photos-${{ matrix.target }}-${{ matrix.emsdk.flavor }}
          path: artifacts/photos-${{ matrix.target }}-${{ matrix.emsdk.flavor }}
          if-no-files-found: error

  build-macos:
    name: Build photos-${{ matrix.target }}
    runs-on: macos-14
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    strategy:
      fail-fast: false
      matrix:
        target: [osx-arm64, osx-x64]
    steps:
      - uses: actions/checkout@v4
      - name: Fetch photo dependencies
        run: git submodule update --init libraw lcms2 libjpeg-turbo zlib
      - name: Set up Autotools
        run: brew install autoconf automake libtool pkg-config cmake
      - name: Build shared and static libraries
        run: ./scripts/build-photos.sh "${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: photos-${{ matrix.target }}
          path: artifacts/photos-${{ matrix.target }}
          if-no-files-found: error

  pack-and-publish:
    name: Pack and publish LightStudio.Photos
    runs-on: ubuntu-22.04
    needs: [build-linux, build-windows, build-windows-arm64, build-windows-static, build-android, build-browser-wasm, build-macos]
    steps:
      - uses: actions/checkout@v4
      - name: Fetch licenses
        run: git submodule update --init libraw lcms2 libjpeg-turbo zlib
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Resolve package version
        id: version
        env:
          DISPATCH_VERSION: ${{ inputs.package_version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            package_version="$DISPATCH_VERSION"
          else
            package_version="${GITHUB_REF_NAME#photos-v}"
          fi
          if [[ ! "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid NuGet package version: $package_version" >&2
            exit 1
          fi
          echo "value=$package_version" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: photos-*
      - name: Pack NuGet package
        run: >-
          dotnet pack package/photos/LightStudio.Photos.csproj
          --configuration Release --output "$PACKAGE_OUTPUT"
          -p:PackageVersion=${{ steps.version.outputs.value }}
          -p:ContinuousIntegrationBuild=true
      - uses: actions/upload-artifact@v4
        with:
          name: LightStudio.Photos-${{ steps.version.outputs.value }}
          path: ${{ env.PACKAGE_OUTPUT }}/LightStudio.Photos.*.nupkg
          if-no-files-found: error
      - name: Publish to NuGet.org
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.NUGET_API_KEY }}
        run: >-
          dotnet nuget push "$PACKAGE_OUTPUT/LightStudio.Photos.*.nupkg"
          --api-key "$NUGET_AUTH_TOKEN" --source "$NUGET_SOURCE" --skip-duplicate