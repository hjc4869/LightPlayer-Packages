name: Build and publish LightStudio.Onnx

on:
  push:
    tags:
      - "onnx-v*"
  workflow_dispatch:
    inputs:
      package_version:
        description: NuGet package version
        required: true
        default: "1.30.0"
        type: string
      publish:
        description: Publish the complete package to NuGet.org
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: onnx-${{ github.ref }}
  cancel-in-progress: false

env:
  JOBS: "3"
  PYTHON: python

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check workflow and shell scripts
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 .github/workflows/onnx.yml
          docker run --rm -v "$PWD:/repo" -w /repo --entrypoint shellcheck rhysd/actionlint:1.7.12 scripts/build-onnx.sh scripts/check-onnx-native.sh scripts/test-onnx-package.sh

  build-linux:
    name: Build onnx-${{ matrix.rid }} (glibc 2.39)
    runs-on: ${{ matrix.runner }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-24.04
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build in pinned release environment
        run: |
          docker build -f scripts/onnx-linux.Dockerfile -t lightstudio-onnx-build .
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e JOBS \
            -v "$PWD:/work" -w /work lightstudio-onnx-build bash scripts/build-onnx.sh "${{ matrix.rid }}"
      - name: Verify native ABI and bundled dependencies
        run: bash scripts/check-onnx-native.sh "${{ matrix.rid }}"
      - name: Install software Vulkan for portable GPU smoke tests
        run: |
          sudo -n apt-get update
          sudo -n apt-get install --no-install-recommends -y libvulkan1 mesa-vulkan-drivers
      - name: Test package-only managed CPU and WebGPU execution
        env:
          ONNX_TEST_GPU: "1"
        run: bash scripts/test-onnx-package.sh "${{ matrix.rid }}" "1.30.0-ci.${{ github.run_id }}"
      - uses: actions/upload-artifact@v4
        with:
          name: onnx-${{ matrix.rid }}
          path: artifacts/onnx-${{ matrix.rid }}
          if-no-files-found: error

  build-macos:
    name: Build onnx-${{ matrix.rid }} (Dawn Metal)
    runs-on: macos-15
    needs: lint
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    strategy:
      fail-fast: false
      matrix:
        rid: [osx-arm64, osx-x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install build tools
        run: python -m pip install cmake==3.31.6 ninja==1.11.1.4 Jinja2==3.1.6 packaging==25.0
      - name: Enable Intel consumer execution
        if: matrix.rid == 'osx-x64'
        run: softwareupdate --install-rosetta --agree-to-license
      - name: Build, check native dependencies, and test managed package
        run: |
          bash scripts/build-onnx.sh "${{ matrix.rid }}"
          bash scripts/check-onnx-native.sh "${{ matrix.rid }}"
          bash scripts/test-onnx-package.sh "${{ matrix.rid }}" "1.30.0-ci.${{ github.run_id }}"
      - uses: actions/upload-artifact@v4
        with:
          name: onnx-${{ matrix.rid }}
          path: artifacts/onnx-${{ matrix.rid }}
          if-no-files-found: error

  build-android:
    name: Build onnx-${{ matrix.rid }} (Dawn Vulkan)
    runs-on: ubuntu-24.04
    needs: lint
    env:
      ANDROID_API_LEVEL: "27"
    strategy:
      fail-fast: false
      matrix:
        rid: [android-arm64, android-x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: 'ndk;28.2.13676358'
      - name: Install build tools
        run: python -m pip install cmake==3.31.6 ninja==1.11.1.4 Jinja2==3.1.6 packaging==25.0
      - name: Build and inspect Android runtime
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          bash scripts/build-onnx.sh "${{ matrix.rid }}"
          bash scripts/check-onnx-native.sh "${{ matrix.rid }}"
          bash scripts/test-onnx-package.sh "${{ matrix.rid }}" "1.30.0-ci.${{ github.run_id }}"
      - uses: actions/upload-artifact@v4
        with:
          name: onnx-${{ matrix.rid }}
          path: artifacts/onnx-${{ matrix.rid }}
          if-no-files-found: error

  pack-and-publish:
    name: Pack complete LightStudio.Onnx
    runs-on: ubuntu-24.04
    needs: [build-linux, build-macos, build-android]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/download-artifact@v4
        with:
          pattern: onnx-*
          path: artifacts
      - name: Resolve package version
        id: version
        env:
          DISPATCH_VERSION: ${{ inputs.package_version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            package_version="$DISPATCH_VERSION"
          else
            package_version="${GITHUB_REF_NAME#onnx-v}"
          fi
          if [[ ! "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            printf 'Invalid NuGet package version: %s\n' "$package_version" >&2
            exit 1
          fi
          echo "value=$package_version" >> "$GITHUB_OUTPUT"
      - name: Pack all RIDs and validate the final dependency graph
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          dotnet pack package/onnx/LightStudio.Onnx.csproj -c Release -o artifacts/packages -p:PackageVersion="$PACKAGE_VERSION"
          dotnet run --project tests/onnx/consumer/OnnxConsumer.csproj -c Release -p:OnnxPackageVersion="$PACKAGE_VERSION" -- \
            --check-package "artifacts/packages/LightStudio.Onnx.$PACKAGE_VERSION.nupkg" \
            'linux-x64;linux-arm64;osx-x64;osx-arm64;android-x64;android-arm64'
          dotnet run --project tests/onnx/consumer/OnnxConsumer.csproj -c Release -p:OnnxPackageVersion="$PACKAGE_VERSION" -- \
            --cpu-smoke artifacts/onnx-linux-x64/smoke.onnx
      - uses: actions/upload-artifact@v4
        with:
          name: LightStudio.Onnx-nuget
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
      - name: Publish to NuGet.org
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push artifacts/packages/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate