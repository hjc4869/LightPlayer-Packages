name: Build and publish LightStudio.Ffmpeg

on:
  push:
    tags:
      - "ffmpeg-v*"
  workflow_dispatch:
    inputs:
      package_version:
        description: NuGet package version
        required: true
        default: "9.0.2.1"
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: ffmpeg-${{ github.ref }}
  cancel-in-progress: false

env:
  PACKAGE_OUTPUT: artifacts/packages
  NUGET_SOURCE: https://api.nuget.org/v3/index.json

jobs:
  build-browser-wasm:
    name: Build ${{ matrix.artifact }}-${{ matrix.emsdk.flavor }}
    runs-on: ubuntu-24.04
    env:
      EMSCRIPTEN_VERSION: ${{ matrix.emsdk.version }}
    strategy:
      fail-fast: false
      matrix:
        variant: [single-threaded, multi-threaded]
        emsdk:
          - version: '3.1.69'
            flavor: em3
          - version: '6.0.2'
            flavor: em6
        include:
          - variant: single-threaded
            artifact: ffmpeg-browser-wasm
          - variant: multi-threaded
            artifact: ffmpeg-MT-browser-wasm

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Fetch libjxl dependencies
        run: ./scripts/fetch-libjxl-dependencies.sh

      - name: Set up cmake, meson and ninja
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y cmake meson ninja-build
          cmake --version
          meson --version
          ninja --version

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSCRIPTEN_VERSION }}
          actions-cache-folder: artifacts/emsdk-cache

      - name: Build FFmpeg static libraries
        run: ./scripts/build-ffmpeg-browser-wasm.sh "${{ matrix.variant }}"

      - name: Verify PGS subtitle support
        shell: bash
        run: |
          variant="${{ matrix.variant }}"
          thread_options=()
          if [[ "$variant" == "multi-threaded" ]]; then
            thread_options=(-pthread -sPROXY_TO_PTHREAD=1)
          fi
          em++ -O2 "${thread_options[@]}" \
            -I ffmpeg -I "artifacts/build/${{ matrix.artifact }}-${{ matrix.emsdk.flavor }}" \
            tests/ffmpeg/pgs-support.cc \
            artifacts/${{ matrix.artifact }}-${{ matrix.emsdk.flavor }}/*.a \
            -sALLOW_MEMORY_GROWTH=1 -sEXIT_RUNTIME=1 \
            -o "artifacts/build/${{ matrix.artifact }}-${{ matrix.emsdk.flavor }}/pgs-support.js"
          node "artifacts/build/${{ matrix.artifact }}-${{ matrix.emsdk.flavor }}/pgs-support.js"

      - name: Upload native artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ matrix.emsdk.flavor }}
          path: artifacts/${{ matrix.artifact }}-${{ matrix.emsdk.flavor }}
          if-no-files-found: error

  build-osx-arm64:
    name: Build ffmpeg-osx-arm64
    runs-on: macos-14
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Fetch libjxl dependencies
        run: ./scripts/fetch-libjxl-dependencies.sh

      - name: Set up cmake, meson and ninja
        run: |
          brew install cmake meson ninja || brew upgrade cmake meson ninja
          cmake --version
          meson --version
          ninja --version

      - name: Build FFmpeg libraries
        run: ./scripts/build-ffmpeg-osx-arm64.sh

      - name: Upload native artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-osx-arm64
          path: artifacts/ffmpeg-osx-arm64
          if-no-files-found: error

  build-windows:
    name: Build ffmpeg-${{ matrix.rid }}
    runs-on: windows-2022
    env:
      FFMPEG_BUILD_JOBS: "4"
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            vc_arch: x64
          - rid: win-arm64
            vc_arch: amd64_arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up MSVC and Windows SDK
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.vc_arch }}

      - name: Set up MSYS2 and LLVM
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          path-type: inherit
          update: true
          install: >-
            make diffutils pkgconf nasm perl
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-lld
            mingw-w64-ucrt-x86_64-llvm
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-meson

      - name: Fetch libjxl dependencies
        shell: msys2 {0}
        run: bash scripts/fetch-libjxl-dependencies.sh

      - name: Build LGPL FFmpeg static and shared libraries
        shell: msys2 {0}
        run: |
          export PATH="/usr/bin:/ucrt64/bin:$PATH"
          bash scripts/build-ffmpeg-windows.sh "${{ matrix.rid }}"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Verify MSVC and NativeAOT static and shared consumers
        shell: pwsh
        run: ./scripts/test-ffmpeg-windows.ps1 -Target '${{ matrix.rid }}'

      - name: Upload ARM64 smoke executables and DLLs
        if: matrix.rid == 'win-arm64'
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-tests-win-arm64
          path: |
            artifacts/tests/ffmpeg-win-arm64/*.exe
            artifacts/tests/ffmpeg-win-arm64/shared/*.exe
            artifacts/tests/ffmpeg-win-arm64/shared/*.dll
          if-no-files-found: error

      - name: Upload native artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.rid }}
          path: artifacts/ffmpeg-${{ matrix.rid }}
          if-no-files-found: error

  test-windows-arm64:
    name: Run Windows ARM64 static and shared consumers
    runs-on: windows-11-arm
    needs: build-windows
    steps:
      - name: Download ARM64 smoke executables and DLLs
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg-tests-win-arm64
          path: native-tests

      - name: Run MSVC and NativeAOT consumers
        shell: pwsh
        run: |
          ./native-tests/pgs-support.exe
          if ($LASTEXITCODE -ne 0) { throw 'ARM64 PGS smoke test failed' }
          ./native-tests/FfmpegConsumer.exe
            if ($LASTEXITCODE -ne 0) { throw 'ARM64 static NativeAOT consumer failed' }
            ./native-tests/shared/FfmpegConsumer.exe
            if ($LASTEXITCODE -ne 0) { throw 'ARM64 shared NativeAOT consumer failed' }

  build-android:
    name: Build ffmpeg-android
    runs-on: macos-15
    env:
      ANDROID_API_LEVEL: "35"
      ANDROID_NDK_VERSION: 28.2.13676358

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Fetch libjxl dependencies
        run: ./scripts/fetch-libjxl-dependencies.sh

      - name: Ensure Rosetta 2
        run: softwareupdate --install-rosetta --agree-to-license

      - name: Set up nasm, cmake, meson and ninja
        run: |
          brew install nasm cmake meson ninja || brew upgrade nasm cmake meson ninja
          nasm --version
          cmake --version
          meson --version
          ninja --version

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358'

      - name: Build FFmpeg libraries
        run: |
          android_sdk_root="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export ANDROID_NDK_HOME="$android_sdk_root/ndk/$ANDROID_NDK_VERSION"
          ./scripts/build-ffmpeg-android.sh

      - name: Upload native artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-android
          path: artifacts/ffmpeg-android
          if-no-files-found: error

  pack-and-publish:
    name: Pack and publish LightStudio.Ffmpeg
    runs-on: ubuntu-24.04
    needs:
      - build-browser-wasm
      - build-osx-arm64
      - build-android
      - build-windows
      - test-windows-arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Fetch libjxl dependencies
        run: ./scripts/fetch-libjxl-dependencies.sh

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve package version
        id: package-version
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.package_version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            package_version="$DISPATCH_VERSION"
          else
            package_version="${GITHUB_REF_NAME#ffmpeg-v}"
          fi

          if [[ ! "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid NuGet package version: $package_version" >&2
            exit 1
          fi

          echo "value=$package_version" >> "$GITHUB_OUTPUT"

      - name: Download native artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: ffmpeg-*

      - name: Verify Windows package layout and static selection
        shell: pwsh
        run: ./scripts/test-ffmpeg-package.ps1 -SkipNative

      - name: Pack NuGet package
        run: >-
          dotnet pack package/LightStudio.Ffmpeg.csproj
          --configuration Release
          --output "$PACKAGE_OUTPUT"
          -p:PackageVersion=${{ steps.package-version.outputs.value }}
          -p:ContinuousIntegrationBuild=true

      - name: Upload NuGet artifact
        uses: actions/upload-artifact@v4
        with:
          name: LightStudio.Ffmpeg-${{ steps.package-version.outputs.value }}
          path: ${{ env.PACKAGE_OUTPUT }}/*.nupkg
          if-no-files-found: error

      # - name: Publish to NuGet.org
      #   env:
      #     NUGET_AUTH_TOKEN: ${{ secrets.NUGET_API_KEY }}
      #   run: >-
      #     dotnet nuget push "$PACKAGE_OUTPUT/*.nupkg"
      #     --api-key "$NUGET_AUTH_TOKEN"
      #     --source "$NUGET_SOURCE"
      #     --skip-duplicate
