name: Build and publish LightStudio.AvaloniaStatic

on:
  push:
    tags:
      - "avalonia-static-v*"
  workflow_dispatch:
    inputs:
      package_version:
        description: NuGet package version (native sources remain pinned to Avalonia 12.1.3)
        required: true
        default: "12.1.3"
        type: string
      publish:
        description: Publish the complete package to NuGet.org
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: avalonia-static-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      package_version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - name: Check workflow and build entry point
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 .github/workflows/avalonia-static.yml
          python3 scripts/build-avalonia-static.py --help
      - name: Resolve package version
        id: version
        env:
          DISPATCH_VERSION: ${{ inputs.package_version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            package_version="$DISPATCH_VERSION"
          else
            package_version="${GITHUB_REF_NAME#avalonia-static-v}"
          fi
          if [[ ! "$package_version" =~ ^12\.[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            printf 'Expected an Avalonia 12.x NuGet package version, got: %s\n' "$package_version" >&2
            exit 1
          fi
          echo "value=$package_version" >> "$GITHUB_OUTPUT"

  build:
    name: Build avalonia-static-${{ matrix.rid }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-24.04
            platform: linux
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
            platform: linux
          - rid: win-x64
            runner: windows-2022
            platform: windows
            toolchain_arch: amd64
          - rid: win-arm64
            runner: windows-2022
            platform: windows
            toolchain_arch: amd64_arm64
          - rid: osx-x64
            runner: macos-15
            platform: macos
          - rid: osx-arm64
            runner: macos-15
            platform: macos
          - rid: android-x64
            runner: ubuntu-24.04
            platform: android
          - rid: android-arm64
            runner: ubuntu-24.04
            platform: android
    steps:
      - uses: actions/checkout@v4
      - name: Restore native build cache
        uses: actions/cache@v4
        with:
          path: artifacts/build/avalonia-static
          key: avalonia-static-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.rid }}-${{ hashFiles('scripts/build-avalonia-static.py', 'scripts/avalonia-static/**') }}
      - uses: actions/setup-python@v5
        if: matrix.platform != 'linux'
        with:
          python-version: "3.12"
      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.platform == 'windows'
        with:
          arch: ${{ matrix.toolchain_arch }}
      - name: Set up Windows native tools
        if: matrix.platform == 'windows'
        run: |
          git config --global core.longpaths true
          echo 'C:/Program Files/LLVM/bin' >> "$GITHUB_PATH"
          choco install ninja --no-progress -y
      - uses: actions/setup-dotnet@v4
        if: matrix.platform == 'macos'
        with:
          dotnet-version: 10.0.x
      - name: Install macOS native tools
        if: matrix.platform == 'macos'
        run: |
          brew install ninja llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
      - name: Install Xcode Metal toolchain
        if: matrix.platform == 'macos'
        run: |
          metal_source="$RUNNER_TEMP/avalonia-static-check.metal"
          metal_output="$RUNNER_TEMP/avalonia-static-check.air"
          printf '%s\n' '#include <metal_stdlib>' 'using namespace metal;' \
            'kernel void check(device float* values [[buffer(0)]], uint index [[thread_position_in_grid]]) { values[index] = 0; }' > "$metal_source"
          if ! xcrun metal -c "$metal_source" -o "$metal_output" >/dev/null 2>&1; then
            sudo -n xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun metal -c "$metal_source" -o "$metal_output"
      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        if: matrix.platform == 'android'
        with:
          packages: 'ndk;28.2.13676358'
      - name: Install Android host tools
        if: matrix.platform == 'android'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang lld llvm ninja-build pkg-config
      - name: Build Linux in the pinned release environment
        if: matrix.platform == 'linux'
        run: |
          docker build -f scripts/avalonia-static/linux.Dockerfile -t lightstudio-avalonia-static scripts/avalonia-static
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e JOBS \
            -v "$PWD:/work" -w /work lightstudio-avalonia-static python3 scripts/build-avalonia-static.py "${{ matrix.rid }}"
      - name: Build Windows or macOS archives
        if: matrix.platform == 'windows' || matrix.platform == 'macos'
        run: python scripts/build-avalonia-static.py "${{ matrix.rid }}"
      - name: Build Android archives
        if: matrix.platform == 'android'
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          python3 scripts/build-avalonia-static.py "${{ matrix.rid }}"
      - uses: actions/upload-artifact@v4
        with:
          name: avalonia-static-${{ matrix.rid }}
          path: artifacts/avalonia-static-${{ matrix.rid }}
          if-no-files-found: error

  pack-and-publish:
    name: Pack complete LightStudio.AvaloniaStatic
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/download-artifact@v4
        with:
          pattern: avalonia-static-*
          path: artifacts
      - name: Pack all eight RIDs
        env:
          PACKAGE_VERSION: ${{ needs.prepare.outputs.package_version }}
        run: dotnet pack package/avalonia-static/LightStudio.AvaloniaStatic.csproj -c Release -o artifacts/packages -p:PackageVersion="$PACKAGE_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: LightStudio.AvaloniaStatic-nuget
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
      - name: Publish to NuGet.org
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push artifacts/packages/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
