name: Build and publish LightStudio.Fonts

on:
  push:
    tags:
      - "fonts-v*"
  workflow_dispatch:
    inputs:
      package_version:
        description: NuGet package version
        required: true
        default: "1.0.0"
        type: string
      publish:
        description: Publish the fonts package to NuGet.org
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: fonts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pack-and-publish:
    name: Pack LightStudio.Fonts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Check workflow
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 .github/workflows/fonts.yml
      - name: Resolve package version
        id: version
        env:
          DISPATCH_VERSION: ${{ inputs.package_version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            package_version="$DISPATCH_VERSION"
          else
            package_version="${GITHUB_REF_NAME#fonts-v}"
          fi
          if [[ ! "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            printf 'Invalid NuGet package version: %s\n' "$package_version" >&2
            exit 1
          fi
          echo "value=$package_version" >> "$GITHUB_OUTPUT"
      - name: Pack fonts and license
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.value }}
        run: dotnet pack package/fonts/LightStudio.Fonts.csproj -c Release -o artifacts/packages -p:PackageVersion="$PACKAGE_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: LightStudio.Fonts-nuget
          path: artifacts/packages/LightStudio.Fonts.*.nupkg
          if-no-files-found: error
      - name: Publish to NuGet.org
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push artifacts/packages/LightStudio.Fonts.*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
