name: Build and publish FFmpeg Android

on:
  push:
    tags:
      - "ffmpeg-v*"
  workflow_dispatch:
    inputs:
      package_version:
        description: NuGet package version
        required: true
        default: "8.1.2"
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: ffmpeg-android-${{ github.ref }}
  cancel-in-progress: false

env:
  ANDROID_API_LEVEL: "35"
  PACKAGE_OUTPUT: artifacts/packages
  NUGET_SOURCE: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json

jobs:
  build-and-publish:
    name: Build and publish LightStudio.Ffmpeg.Android
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Ensure Rosetta 2
        run: softwareupdate --install-rosetta --agree-to-license

      - name: Set up nasm, meson and ninja
        run: |
          brew install nasm meson ninja || brew upgrade nasm meson ninja
          nasm --version
          meson --version
          ninja --version

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358'

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve package version
        id: package-version
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.package_version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            package_version="$DISPATCH_VERSION"
          else
            package_version="${GITHUB_REF_NAME#ffmpeg-v}"
          fi

          if [[ ! "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid NuGet package version: $package_version" >&2
            exit 1
          fi

          echo "value=$package_version" >> "$GITHUB_OUTPUT"

      - name: Build FFmpeg libraries
        env:
          ANDROID_API_LEVEL: ${{ env.ANDROID_API_LEVEL }}
        run: |
          android_sdk_root="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export ANDROID_NDK_HOME="$android_sdk_root/ndk/28.2.13676358"
          ./scripts/build-ffmpeg-android.sh

      - name: Pack NuGet package
        run: >-
          dotnet pack package/LightStudio.Ffmpeg.Android.csproj
          --configuration Release
          --output "$PACKAGE_OUTPUT"
          -p:PackageVersion=${{ steps.package-version.outputs.value }}
          -p:ContinuousIntegrationBuild=true

      - name: Upload NuGet artifact
        uses: actions/upload-artifact@v4
        with:
          name: LightStudio.Ffmpeg.Android-${{ steps.package-version.outputs.value }}
          path: ${{ env.PACKAGE_OUTPUT }}/*.nupkg
          if-no-files-found: error

      - name: Publish to GitHub Packages
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          dotnet nuget push "$PACKAGE_OUTPUT/*.nupkg"
          --api-key "$NUGET_AUTH_TOKEN"
          --source "$NUGET_SOURCE"
          --skip-duplicate
